name: Build iPhone engine
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source and apply iPhone changes
        shell: bash
        run: |
          git init game
          git -C game remote add origin https://github.com/OutThisLife/azeroth-survivors-re.git
          git -C game fetch --depth 1 origin 72048f4056e2a57d99234e4fb658179e577d1d92
          git -C game checkout --detach FETCH_HEAD
          git -C game apply --check ../iphone.patch
          git -C game apply ../iphone.patch
      - name: Install pinned Rust toolchain
        working-directory: game
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Restore compiled dependencies
        id: rust-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            game/target
          key: ios-intel-rust1981-v1-${{ hashFiles('game/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-intel-rust1981-v1-${{ hashFiles('game/Cargo.lock') }}-
      - name: Build native iPhone engine
        working-directory: game
        run: bash scripts/ios-build.sh
      - name: Preserve compilation progress even on failure
        if: always() && steps.rust-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            game/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: iphone-engine
          path: game/ios/build/iphone-engine.zip
          if-no-files-found: error
          retention-days: 3
